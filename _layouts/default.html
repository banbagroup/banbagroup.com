<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:url" content="https://www.banbagroup.com{{page.url}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{page.cover_image | default: 'https://www.banbagroup.com/assets/images/banbagroup-logo-dark-facebook.jpg'}}" />
    <meta property="og:description" content="Banba Group has closed. For queries, contact hi@banbagroup.com" />

    <title>{{page.title}}</title>
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/banbagroup-favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen overflow-hidden flex items-center justify-center bg-white text-gray-700 antialiased">
    {{content}}
  </body>
</html>
